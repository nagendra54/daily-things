: "Salads, sandwiches, soups, and the sauce on pizza and pasta.", "how": "Tomato plants grow little yellow flowers. Each flower can turn into a small green tomato, which turns red as it ripens.", "made": "Juicy flesh, full of little seeds.", "origin": "Tomatoes first came from South and Central America. Now people grow them all over the world.", "fun": "Tomatoes are really fruits, because they have seeds inside. But most people cook them like vegetables!"}, {"title": "COCONUT", "img": "coconut", "subject": "Nature", "description": "A coconut is the big, hard fruit of a coconut palm tree. It is hairy on the outside and white inside.", "purpose": "Eating the white flesh, drinking the coconut water, and making coconut milk and oil.", "how": "Inside the hard shell is a seed. If a coconut lands on a sandy beach, it can sprout and grow into a new palm tree.", "made": "A hairy brown shell, crunchy white flesh, and clear coconut water inside.", "origin": "Coconut palms grow by warm seas. People have used coconuts for thousands of years.", "fun": "Coconuts can float! They can drift across the sea and grow on a faraway beach. Opening one needs strong tools, so ask a grown-up to help."}, {"title": "MUSHROOM", "img": "mushroom", "subject": "Nature", "description": "A mushroom is a fungus, not a plant. It often has a round cap on top of a stalk.", "purpose": "Some mushrooms are good to eat. In the woods, mushrooms help old leaves and wood rot away into soil.", "how": "A mushroom grows from tiny threads hidden in the soil or wood. It lets out tiny dust called spores, which can grow into new mushrooms.", "made": "Soft, spongy stuff. A mushroom has no leaves and no green colour.", "origin": "Mushrooms have grown on Earth for millions of years. People have grown some kinds to eat for hundreds of years.", "fun": "Some mushrooms glow in the dark! But never eat a wild mushroom without a grown-up checking, because some are poisonous."}, {"title": "PUMPKIN", "img": "pumpkin", "subject": "Nature", "description": "A pumpkin is a big, round, orange squash. It grows on a long vine that creeps along the ground.", "purpose": "Making soup and pie, roasting the seeds, and carving into lanterns.", "how": "A pumpkin vine grows big yellow flowers. Bees carry pollen from flower to flower, and some flowers grow into pumpkins.", "made": "A thick orange skin, soft orange flesh, and lots of seeds in the middle.", "origin": "Pumpkins first came from North and Central America, where people have grown them for thousands of years.", "fun": "The biggest pumpkins grow heavier than a small car! Carving one needs a sharp knife, so ask a grown-up to help."}, {"title": "LEMON", "img": "lemon", "subject": "Nature", "description": "A lemon is a yellow fruit with a very sour taste.", "purpose": "Adding a fresh, sour flavour to drinks, cakes and food, and making lemonade.", "how": "Lemons grow on trees in warm places. Their juice is full of a natural acid, which makes it taste sour.", "made": "A bright yellow peel and juicy, sour segments with pips.", "origin": "Lemons first grew in Asia long ago. Travellers carried them all over the world.", "fun": "Write a secret message with lemon juice. When a grown-up gently warms the paper, the writing turns brown and appears! Ask a grown-up to help."}, {"title": "GRAPES", "img": "grapes", "subject": "Nature", "description": "Grapes are small, round, juicy fruits that grow in bunches.", "purpose": "Eating as a snack, drying into raisins, and making juice.", "how": "Grapes grow on climbing plants called vines. Each bunch starts as tiny flowers that turn into little green berries.", "made": "A thin skin, sweet juicy flesh, and sometimes little seeds.", "origin": "People have grown grapes for thousands of years.", "fun": "A raisin is just a grape that has been dried! For little children, grapes should be cut in half, so ask a grown-up to help."}, {"title": "WATERMELON", "img": "watermelon", "subject": "Nature", "description": "A watermelon is a huge, round fruit with a green skin and a juicy red inside.", "purpose": "A cool, sweet snack on a hot day.", "how": "Watermelons grow on vines along the ground. The fruit fills up with lots of water as it grows, so it is very juicy.", "made": "A thick green rind, sweet red flesh, and black seeds.", "origin": "Watermelons first came from Africa, where people have grown them for thousands of years.", "fun": "A watermelon is mostly water. That is how it got its name! Cutting one needs a big knife, so ask a grown-up to help."}, {"title": "PEANUT", "img": "peanut", "subject": "Nature", "description": "A peanut is a small, tasty seed that grows inside a thin, crinkly shell.", "purpose": "Eating as a snack, and making peanut butter.", "how": "After a peanut plant flowers, little stalks push down into the soil. The peanuts grow underground!", "made": "A papery shell, usually with two seeds inside, each in a thin red-brown skin.", "origin": "Peanuts first came from South America, where people have grown them for thousands of years.", "fun": "Peanuts are not really nuts. They are related to peas and beans! Some people are allergic to peanuts, so always ask a grown-up before sharing them."}, {"title": "RICE", "img": "rice", "subject": "Nature", "description": "Rice is the tiny seed of a grassy plant. People all over the world cook and eat it.", "purpose": "Making meals like fried rice, sushi, risotto and rice pudding.", "how": "Rice plants often grow in flooded fields called paddies. The ripe grains are cut, dried and cleaned. Cooking rice uses boiling water, so ask a grown-up to help.", "made": "Each grain is a seed, mostly starch, which gives your body energy.", "origin": "People in Asia have grown rice for thousands of years.", "fun": "More than half the people in the world eat rice as one of their main foods!"}, {"title": "DANDELION", "img": "dandelion", "subject": "Nature", "description": "A dandelion is a small wild plant with a bright yellow flower. Later, the flower turns into a fluffy white ball of seeds.", "purpose": "Feeding bees and butterflies, and spreading its seeds to grow new dandelions.", "how": "Each fluffy seed has its own tiny parachute. When the wind blows, the seeds float away to grow somewhere new.", "made": "Jagged green leaves, a hollow stem, and a flower head made of lots of tiny yellow flowers.", "origin": "Dandelions grow wild in many places around the world. The name comes from French words meaning “lion’s tooth”, because of the jagged leaves.", "fun": "Blow on a fluffy dandelion clock and watch the seeds fly. Some people make a wish as they blow!"}, {"title": "SAND", "img": "sand", "subject": "Nature", "description": "Sand is lots and lots of tiny bits of rock and shell. You find it on beaches and in deserts.", "purpose": "Making beaches and deserts, building sandcastles, and making glass and concrete.", "how": "Over a very long time, wind, waves and rivers break rocks into smaller and smaller pieces, until they are sand.", "made": "Tiny grains of rock, often a hard mineral called quartz, and sometimes bits of shell.", "origin": "Wind, rain and the sea have been making sand for millions of years, and they are still making it today.", "fun": "Most glass is made by melting sand in a super-hot oven. Your window was once sand!"}, {"title": "COTTON", "img": "cotton", "subject": "Nature", "description": "Cotton is the soft, white fluff that grows on a cotton plant. It bursts out of a round pod called a boll.", "purpose": "Spinning into thread, to make T-shirts, socks, towels and lots of other cloth.", "how": "The fluffy fibres grow around the seeds inside the boll. When the boll opens, the fluff is picked, cleaned and spun into thread.", "made": "Soft, white plant fibres.", "origin": "People in different parts of the world have grown cotton and woven it into cloth for thousands of years.", "fun": "Look at the label on your T-shirt. If it says cotton, it grew on a plant!"}, {"title": "AVOCADO", "img": "avocado", "subject": "Nature", "description": "An avocado is a green fruit with creamy flesh and one big seed inside.", "purpose": "Spreading on toast, slicing into salads, and mashing into guacamole.", "how": "Avocados grow on trees. They are picked while they are hard, and only go soft and ripe after they come off the tree.", "made": "A dark green skin, soft, creamy green flesh, and one big round stone.", "origin": "Avocados first came from Mexico and Central America, where people have eaten them for thousands of years.", "fun": "You can try growing a little avocado tree from the big stone! Cutting the fruit needs a sharp knife, so ask a grown-up to help."}, {"title": "MAGNET", "img": "magnet", "subject": "Science", "description": "A magnet is a piece of metal that can pull things made of iron and steel towards it, without even touching them.", "purpose": "Holding notes on the fridge, keeping cupboard doors shut, and working inside compasses, speakers and motors.", "how": "Every magnet has a north end and a south end. Opposite ends pull together, and matching ends push each other away.", "made": "Iron or steel, or special mixes of metals that make very strong magnets.", "origin": "Long ago, people found natural magnetic rocks called lodestones. They used them to make the first compasses.", "fun": "The Earth itself is like a giant magnet! Small magnets must never go in your mouth, so ask a grown-up to help with them."}, {"title": "LIGHT BULB", "img": "light-bulb", "subject": "Science", "description": "A light bulb is a glass bulb that glows brightly when electricity flows into it.", "purpose": "Lighting up rooms, streets and lamps when it is dark.", "how": "In old-style bulbs, a very thin wire gets so hot that it glows. Newer LED bulbs have tiny parts that glow and use much less electricity.", "made": "Glass and metal, with a thin wire or small LED lights inside.", "origin": "Inventors made the first long-lasting light bulbs about 150 years ago.", "fun": "In cartoons, a light bulb over someone's head means they have had a bright idea! Bulbs can get very hot, so ask a grown-up to help change one."}, {"title": "BATTERY", "img": "battery", "subject": "Science", "description": "A battery is a small store of electricity. It powers things like toys, torches and remote controls.", "purpose": "Giving electricity to things that are not plugged into the wall.", "how": "Chemicals inside the battery make electricity flow out of one end, through your toy, and back into the other end.", "made": "A metal case with special chemicals inside.", "origin": "Alessandro Volta made the first battery in Italy over 200 years ago. The word volt comes from his name.", "fun": "Look for the + and − signs. A battery only works when it faces the right way! Never put a battery in your mouth. Ask a grown-up to help change them."}, {"title": "THERMOMETER", "img": "thermometer", "subject": "Science", "description": "A thermometer is a tool that measures how hot or cold something is.", "purpose": "Checking if you have a fever, how warm the weather is, or if food is cooked.", "how": "In some thermometers, a liquid in a thin tube rises when it gets warmer and sinks when it gets colder. Digital ones have a tiny sensor and a screen.", "made": "Glass or plastic, with a coloured liquid or an electronic sensor inside.", "origin": "Thermometers were first made about 400 years ago.", "fun": "A healthy person's body is about 37 degrees Celsius inside. Ask a grown-up to help take your temperature."}, {"title": "MAGNIFYING GLASS", "img": "magnifying-glass", "subject": "Science", "description": "A magnifying glass is a round, curved lens with a handle. It makes small things look much bigger.", "purpose": "Looking closely at tiny things, like bugs, leaves, stamps and small writing.", "how": "The curved lens bends the light coming from an object, so the object looks bigger to your eyes.", "made": "A lens of glass or clear plastic, held in a metal or plastic frame.", "origin": "People have used curved glass to make things look bigger for hundreds of years.", "fun": "Detectives in stories use magnifying glasses to find tiny clues! Never point one at the sun, because it can make a hot spot that burns. Ask a grown-up to help."}, {"title": "UMBRELLA", "img": "umbrella", "subject": "Science", "description": "An umbrella is a folding cover on a stick. You hold it over your head to keep off the rain.", "purpose": "Keeping you dry in the rain, or shading you from the hot sun.", "how": "Thin metal ribs push the cloth open when you slide them up the stick. When you close it, it folds up small.", "made": "Waterproof cloth, thin metal ribs, and a handle of plastic or wood.", "origin": "People in places like ancient China and Egypt used umbrellas thousands of years ago, mostly for shade from the sun.", "fun": "The word umbrella comes from umbra, a Latin word for shadow!"}, {"title": "SCISSORS", "img": "scissors", "subject": "Science", "description": "Scissors are a cutting tool with two blades joined in the middle.", "purpose": "Cutting paper, card, string, cloth and hair.", "how": "When you squeeze the handles, the two sharp edges slide past each other and snip whatever is between them.", "made": "Steel blades, with metal or plastic handles.", "origin": "Scissors are very old. Scissors that cross in the middle, like ours, were used in ancient Rome.", "fun": "Children's scissors have round tips to keep fingers safe. Always carry scissors with the points down, and ask a grown-up to help."}, {"title": "ZIPPER", "img": "zipper", "subject": "Science", "description": "A zipper, or zip, is two rows of little teeth that lock together to close a coat, bag or pencil case.", "purpose": "Opening and closing clothes and bags quickly.", "how": "As you pull the slider up, it pushes the teeth together so they hook onto each other. Pull it down and it wedges them apart.", "made": "Metal or plastic teeth on strips of cloth, with a metal slider.", "origin": "Zips like ours were invented in America in the early 1900s.", "fun": "Look closely at a zip. Many sliders have the letters YKK on them. That is the name of a company that makes huge numbers of zips!"}, {"title": "BALLOON", "img": "balloon", "subject": "Science", "description": "A balloon is a thin, stretchy bag that you fill with air or a gas called helium.", "purpose": "Decorating parties and celebrations, and playing games.", "how": "Blowing air in stretches the rubber bigger and bigger. Helium is lighter than air, so a helium balloon floats up.", "made": "Stretchy rubber, or shiny foil.", "origin": "Rubber balloons were first made about 200 years ago, for science experiments.", "fun": "Rub a balloon on your hair and it can stick to the wall! If a balloon pops, pick up all the pieces, because little children could choke on them."}, {"title": "CLOCK", "img": "clock", "subject": "Science", "description": "A clock is a machine that shows what time it is.", "purpose": "Telling the time, so you know when to wake up, eat lunch or go to bed.", "how": "The short hand points to the hour and the long hand points to the minutes. Inside, a battery or a wound-up spring keeps the hands moving.", "made": "Plastic, metal or wood, with a glass or plastic cover over the face.", "origin": "Long ago, people told the time with sundials. Clocks with gears were first made in Europe about 700 years ago.", "fun": "Clock hands always go round the same way. That is why we call it clockwise!"}, {"title": "COMPASS", "img": "compass", "subject": "Science", "description": "A compass is a tool with a needle that always points north. It helps you find your way.", "purpose": "Finding directions when you are walking, sailing or exploring.", "how": "The needle is a tiny magnet. It swings round to line up with the Earth's magnetism, so one end points north.", "made": "A magnetic needle on a pin, inside a case with a clear lid, marked N, E, S and W.", "origin": "The compass was invented in China, more than a thousand years ago.", "fun": "Going round clockwise from the top, the letters are N, E, S and W. Remember them with: Never Eat Soggy Waffles!"}, {"title": "TORCH", "img": "torch", "subject": "Science", "description": "A torch is a small light that you can carry around. It runs on batteries.", "purpose": "Seeing in the dark, like on a camping trip or during a power cut.", "how": "When you press the switch, the batteries send electricity to a little bulb. A shiny curved mirror behind it makes a bright beam.", "made": "A plastic or metal case, batteries, a bulb or LED, and a clear cover.", "origin": "Battery torches were invented around the year 1900.", "fun": "In America, a torch is called a flashlight! Never shine one into someone's eyes."}, {"title": "BICYCLE", "img": "bicycle", "subject": "Science", "description": "A bicycle, or bike, has two wheels, a seat and pedals. You ride it by pushing the pedals with your feet.", "purpose": "Getting around, having fun and keeping fit.", "how": "The pedals turn a chain, and the chain turns the back wheel. You steer with the handlebars and squeeze the brakes to stop.", "made": "A metal frame, rubber tyres, a chain and pedals.", "origin": "The first bicycles, about 200 years ago, had no pedals. Riders pushed themselves along with their feet!", "fun": "Everyone wobbles when they first learn to ride. Keep practising, and always wear a helmet!"}, {"title": "SPONGE", "img": "sponge", "subject": "Science", "description": "A sponge is a soft, squishy block full of tiny holes. It soaks up water.", "purpose": "Washing dishes, cleaning tables, and washing yourself in the bath.", "how": "The tiny holes fill up with water. When you squeeze the sponge, the water is pushed back out.", "made": "Most kitchen sponges are made of soft foam. Natural sponges come from the sea.", "origin": "The first sponges people used were real sea sponges, which are simple animals that live on the sea floor.", "fun": "A sea sponge is an animal, but it has no brain, no heart and no eyes!"}, {"title": "ICE CUBE", "img": "ice-cube", "subject": "Science", "description": "An ice cube is a small block of frozen water.", "purpose": "Keeping drinks cold and cooling things down.", "how": "In the freezer, the water gets so cold that it turns solid. When it warms up again, it melts back into water.", "made": "Just water, frozen solid.", "origin": "Before fridges, people cut big blocks of ice from frozen lakes and stored them in cold buildings called ice houses.", "fun": "Ice floats! Water gets a little bigger when it freezes, so ice is lighter than the same amount of water."}, {"title": "CANDLE", "img": "candle", "subject": "Science", "description": "A candle is a stick of wax with a string, called a wick, through the middle. When it is lit, it gives a small flame.", "purpose": "Giving soft light, making a room smell nice, and decorating birthday cakes.", "how": "The flame melts the wax. The melted wax climbs up the wick and burns, which keeps the flame going.", "made": "Wax and a cotton wick.", "origin": "People have made candles for thousands of years, from beeswax and animal fat.", "fun": "On your birthday, make a wish and blow out the candles! A flame is very hot, so ask a grown-up to help."}, {"title": "KEY", "img": "key", "subject": "Science", "description": "A key is a small metal tool that opens a lock.", "purpose": "Locking and unlocking doors, cars, boxes and bikes.", "how": "The bumps on the key push little pins inside the lock to just the right height. Then the lock can turn.", "made": "Metal, usually brass or steel.", "origin": "The ancient Egyptians used wooden locks and keys thousands of years ago.", "fun": "Each key's bumpy pattern fits only its own lock, like a secret code!"}, {"title": "PADLOCK", "img": "padlock", "subject": "Science", "description": "A padlock is a lock you can carry around. It has a curved metal bar on top called a shackle.", "purpose": "Locking gates, lockers, sheds, bikes and boxes.", "how": "Push the shackle down and it clicks shut. To open it, turn the key, or line up the right secret numbers.", "made": "Strong steel or brass.", "origin": "People have used padlocks for a very long time. The ancient Romans had them.", "fun": "Some padlocks open with a secret number instead of a key. Don't forget your number!"}, {"title": "PAPER CLIP", "img": "paper-clip", "subject": "Science", "description": "A paper clip is a bent piece of wire that holds sheets of paper together.", "purpose": "Keeping pages together without making holes in them.", "how": "The springy wire loops squeeze the pages tightly between them.", "made": "Steel wire, sometimes covered in coloured plastic.", "origin": "Paper clips with the famous double-loop shape became popular more than a hundred years ago.", "fun": "Paper clips are made of steel, so a magnet can pick up a whole chain of them! They are small, so ask a grown-up to help keep them away from little children."}, {"title": "CALCULATOR", "img": "calculator", "subject": "Science", "description": "A calculator is a small machine that does sums for you.", "purpose": "Adding, taking away, multiplying and dividing numbers quickly.", "how": "You press the number buttons, a tiny electronic chip inside works out the answer, and it shows on the screen.", "made": "A plastic case, buttons, a screen, a tiny chip, and a battery or a small solar panel.", "origin": "Long ago, people counted with an abacus, which has beads on rods. Pocket calculators arrived in the 1970s.", "fun": "Type 0.7734, then turn the calculator upside down. It says hELLO!"}, {"title": "REMOTE CONTROL", "img": "remote-control", "subject": "Science", "description": "A remote control is a small box of buttons. It lets you work the TV from across the room.", "purpose": "Turning the TV on and off, changing channels and the volume, without getting up.", "how": "When you press a button, the front sends out a beam of invisible light carrying a secret code. The TV catches the beam and does what the code says.", "made": "A plastic case, rubber buttons, a little circuit board and batteries.", "origin": "TV remote controls were first made in the 1950s. Some early ones were joined to the TV by a long wire!", "fun": "Point a remote at a phone camera and press a button. On many phones you can see the invisible light flash! Ask a grown-up to help change the batteries."}, {"title": "FRIDGE", "img": "fridge", "subject": "Science", "description": "A fridge is a big, cold cupboard that keeps food and drinks cool and fresh.", "purpose": "Keeping milk, cheese, fruit and leftovers fresh for longer.", "how": "A special liquid flows through pipes, picking up heat from inside the fridge and letting it out at the back. That is why the back feels warm.", "made": "Metal and plastic, with thick walls that keep the cold in.", "origin": "Before fridges, people kept food cold with big blocks of ice. Electric fridges came into homes in the 1900s.", "fun": "Germs grow very slowly in the cold, so food lasts longer. Close the door quickly to keep the cold inside!"}, {"title": "KETTLE", "img": "kettle", "subject": "Science", "description": "A kettle is a pot with a spout and a handle, used for boiling water.", "purpose": "Boiling water for tea, hot chocolate, cooking and washing up.", "how": "An electric kettle has a heating part at the bottom that makes the water hotter and hotter. It switches itself off when the water boils.", "made": "Metal or tough plastic, with a heating part inside.", "origin": "People have boiled water in metal pots over fires for thousands of years. Electric kettles were invented in the late 1800s.", "fun": "Some kettles whistle when the water boils! Boiling water and steam are very hot, so only a grown-up should use a kettle. Ask a grown-up to help."}, {"title": "STRAW", "img": "straw", "subject": "Science", "description": "A straw is a thin tube that you use to sip a drink.", "purpose": "Drinking without tipping the cup.", "how": "When you suck, you take air out of the straw. The air pressing down on your drink pushes it up the straw into your mouth.", "made": "Paper, plastic, metal, glass or bamboo.", "origin": "People have drunk through straws for thousands of years. Paper drinking straws were invented in the 1880s.", "fun": "Some of the first drinking straws were dry, hollow stalks of grass, called straw. That is how straws got their name!"}, {"title": "SCREW", "img": "screw", "subject": "Science", "description": "A screw is a small metal pin with a spiral ridge wrapped around it. It holds things tightly together.", "purpose": "Joining pieces of wood, metal and plastic, in furniture, toys and houses.", "how": "When you turn a screw with a screwdriver, the spiral ridge pulls it deeper and deeper into the wood.", "made": "Steel or brass.", "origin": "The screw is a very old idea. The ancient Greeks used giant screws to lift water.", "fun": "Remember: righty-tighty, lefty-loosey! Screws are small and sharp, so ask a grown-up to help."}, {"title": "DRUM", "img": "drum", "subject": "Culture", "description": "A drum is a musical instrument you hit to make a beat. It has a tight skin stretched over a hollow shape.", "purpose": "Keeping the beat in music, and for dancing, marching and celebrating.", "how": "When you hit the tight skin, it shakes very fast. The hollow body makes the sound big and loud.", "made": "A hollow body of wood or metal, with a skin of plastic or animal hide stretched over the top.", "origin": "Drums are one of the oldest instruments in the world. People have played them for thousands of years.", "fun": "Your heart beats like a little drum. Tap its beat on a table: ba-dum, ba-dum, ba-dum!"}, {"title": "GUITAR", "img": "guitar", "subject": "Culture", "description": "A guitar is a musical instrument with strings. You strum or pluck the strings to make music.", "purpose": "Playing songs on its own or in a band, and singing along.", "how": "Plucking a string makes it shake. The hollow body makes the sound louder, and pressing the strings on the neck changes the note.", "made": "Wood for the body and neck, with strings of metal or nylon.", "origin": "People have played stringed instruments for thousands of years. The guitar we know today grew up in Spain.", "fun": "Most guitars have six strings, but some have twelve!"}, {"title": "PIANO", "img": "piano", "subject": "Culture", "description": "A piano is a big musical instrument with black and white keys. You press the keys to play music.", "purpose": "Playing music, from quiet songs at home to big concerts.", "how": "Each key moves a little felt hammer. The hammer hits a metal string inside, and the string sings out a note.", "made": "Wood, with metal strings, felt hammers and a long row of keys.", "origin": "The piano was invented in Italy about 300 years ago.", "fun": "Most pianos have 88 keys: 52 white ones and 36 black ones. Count them next time you see one!"}, {"title": "VIOLIN", "img": "violin", "subject": "Culture", "description": "A violin is a small wooden instrument with four strings. You hold it under your chin and play it with a bow.", "purpose": "Playing music in orchestras, folk bands and on its own.", "how": "The bow has long hairs stretched along it. When you slide it across the strings, they shake and make a singing sound.", "made": "Carved wood, with four strings, and a bow usually strung with horse hair.", "origin": "Violins were first made in Italy about 500 years ago.", "fun": "Players rub the bow with sticky rosin so it can grip the strings. Without it, a violin hardly makes a sound!"}, {"title": "CRAYON", "img": "crayon", "subject": "Culture", "description": "A crayon is a colourful stick of wax for drawing and colouring.", "purpose": "Drawing pictures and colouring them in.", "how": "When you press a crayon on paper, a little of the soft wax rubs off and leaves colour behind.", "made": "Wax mixed with colour, often wrapped in a paper label.", "origin": "Wax crayons for children became popular more than 100 years ago.", "fun": "Draw on paper with a white crayon, then paint over it with watery paint. Your secret picture appears like magic!"}, {"title": "PENCIL", "img": "pencil", "subject": "Culture", "description": "A pencil is a thin stick for writing and drawing. It has a dark grey middle that leaves marks on paper.", "purpose": "Writing, drawing and doing sums. Mistakes can be rubbed out with a rubber.", "how": "As you press, tiny bits of the soft grey middle rub off onto the paper and make a line.", "made": "Wood on the outside, with graphite and clay in the middle. Many have a rubber on the end.", "origin": "People have made pencils for hundreds of years, ever since a big lump of graphite was found in England.", "fun": "A pencil's 'lead' has no lead in it at all. It is graphite mixed with clay! Sharp pencils are pointy, so ask a grown-up to help with the sharpener."}, {"title": "BOOK", "img": "book", "subject": "Culture", "description": "A book is lots of pages joined together inside a cover. It is full of words, pictures, or both.", "purpose": "Reading stories, learning new things and looking at pictures.", "how": "The pages are joined along one edge, called the spine, so you can turn them one by one.", "made": "Paper pages, glued or sewn together, with a cover of card or cloth.", "origin": "Long ago, people wrote on long rolls called scrolls. Books with pages you can turn have been around for well over 1,000 years.", "fun": "Some big libraries hold millions of books. You could never read them all, but you could try!"}, {"title": "MARBLES", "img": "marbles", "subject": "Culture", "description": "Marbles are small, shiny glass balls, often with swirls of colour inside. Children play games with them.", "purpose": "Playing games, like trying to knock other marbles out of a circle, and collecting them.", "how": "You flick a marble with your thumb so it rolls across the floor. It is round and smooth, so it rolls fast and far.", "made": "Glass, with coloured glass twisted inside to make the swirls.", "origin": "Children have played with little balls of clay and stone for thousands of years. Glass marbles became popular in the 1800s.", "fun": "Each marble's swirls are a little different, so no two look quite the same! Marbles are small enough to swallow, so keep them away from babies and ask a grown-up to help."}, {"title": "STAMP", "img": "postage-stamp", "subject": "Culture", "description": "A stamp is a small sticky picture you put on a letter. It shows that you have paid to send it.", "purpose": "Paying for a letter or parcel to travel by post.", "how": "You stick the stamp in the top corner of the envelope. The post office marks it so it can't be used again.", "made": "Paper, with a picture printed on the front and glue on the back.", "origin": "The first sticky postage stamp was made in Britain in 1840. It was called the Penny Black.", "fun": "Some people collect stamps from all over the world. Each one is like a tiny piece of art!"}, {"title": "MAP", "img": "map", "subject": "Culture", "description": "A map is a flat picture of a place, as if you were looking down from the sky.", "purpose": "Finding your way, and seeing where places are.", "how": "Lines show roads and rivers, colours show land and water, and little symbols show things like towns and hills.", "made": "Paper printed with ink. Many maps are on screens now too.", "origin": "People have drawn maps for thousands of years, on clay, stone, cloth and paper.", "fun": "Most maps put north at the top. Look for the arrow or the letter N to check!"}, {"title": "FLAG", "img": "flag", "subject": "Culture", "description": "A flag is a piece of cloth with colours or a pattern on it. It often flies on a tall pole.", "purpose": "Showing who a place belongs to, sending signals, and decorating for celebrations.", "how": "A rope on the pole pulls the flag up to the top. Then the wind makes it flap and wave.", "made": "Strong cloth such as cotton or nylon, with a rope and a pole.", "origin": "People have carried flags and banners for a very long time, so groups could spot each other from far away.", "fun": "Sailors can talk from ship to ship with flags. There is a different flag for every letter of the alphabet!"}, {"title": "GLOBE", "img": "globe", "subject": "Culture", "description": "A globe is a ball-shaped map of the whole Earth.", "purpose": "Seeing where countries, seas and mountains are on our round planet.", "how": "It sits on a stand and spins, just like the Earth. Turn it to find places on the other side of the world.", "made": "Card, plastic or metal, covered with a printed map.", "origin": "People have made globes for hundreds of years. The oldest one still around was made in Germany over 500 years ago.", "fun": "Spin a globe and you'll see that most of our planet is covered in blue sea!"}, {"title": "KITE", "img": "kite", "subject": "Culture", "description": "A kite is a light frame covered in cloth or paper that flies in the wind on a long string.", "purpose": "Flying for fun on a windy day, and in colourful kite festivals.", "how": "The wind pushes up under the kite and lifts it high. You hold the string so it stays up and doesn't blow away.", "made": "Thin sticks of wood or plastic, covered with cloth, paper or plastic, and a long string.", "origin": "Kites were first flown in China more than 2,000 years ago.", "fun": "Some kites are shaped like fish, birds or dragons! Always fly kites in open spaces, far away from power lines."}, {"title": "CHESS PIECE", "img": "chess-piece", "subject": "Culture", "description": "A chess piece is one of the little figures used to play the game of chess. Each player has 16 pieces.", "purpose": "Playing chess, a thinking game for two players on a checked board.", "how": "Each kind of piece moves in its own way. You try to trap the other player's king. That's called checkmate!", "made": "Wood or plastic, and sometimes stone or glass.", "origin": "Chess began in India about 1,500 years ago, and then spread all around the world.", "fun": "The knight is the only piece that can jump over other pieces. It hops in an L shape!"}, {"title": "PLAYING CARDS", "img": "playing-cards", "subject": "Culture", "description": "Playing cards are a set of small, flat cards for playing games. A full pack has 52 cards.", "purpose": "Playing card games like snap, and doing magic tricks.", "how": "Each card shows a number or a picture. You shuffle them to mix them up, then share them out to play.", "made": "Thin, stiff card with a smooth coating, or plastic.", "origin": "Playing cards were first made in China more than 1,000 years ago.", "fun": "There are four suits: hearts, diamonds, clubs and spades. Can you guess which two are red?"}, {"title": "DICE", "img": "dice", "subject": "Culture", "description": "Dice are small cubes with dots on each side, from one to six.", "purpose": "Playing board games and other games of chance.", "how": "When you roll a die, it tumbles and lands on one side by chance. The dots on top tell you your number.", "made": "Plastic, wood or bone.", "origin": "People have played games with dice for thousands of years.", "fun": "The dots on opposite sides of a die always add up to seven! Dice are small, so ask a grown-up to help keep them away from babies."}, {"title": "TEDDY BEAR", "img": "teddy-bear", "subject": "Culture", "description": "A teddy bear is a soft, cuddly toy shaped like a bear.", "purpose": "Hugging, playing and keeping you company at bedtime.", "how": "It is stuffed with soft filling, so it squishes when you hug it and puffs back up again.", "made": "Soft, furry fabric filled with stuffing, with eyes and a nose sewn or fixed on.", "origin": "Teddy bears were first made over 100 years ago. They were named after an American president, Theodore 'Teddy' Roosevelt.", "fun": "Some people keep their teddy bear their whole life, even when they are grown-ups!"}, {"title": "FOOTBALL", "img": "football", "subject": "Culture", "description": "A football is a big round ball that you kick with your feet.", "purpose": "Playing football, a team game loved all over the world.", "how": "The ball is full of air, so it is light and bouncy. Kick it and it flies through the air or rolls across the grass.", "made": "A rubber bag full of air inside, covered with panels of leather or plastic.", "origin": "People have kicked balls in games for thousands of years. The football game we play today began in England in the 1800s.", "fun": "In football, only the goalkeeper is allowed to catch the ball with their hands!"}, {"title": "BIRTHDAY CAKE", "img": "birthday-cake", "subject": "Culture", "description": "A birthday cake is a sweet cake made to celebrate someone's birthday. It often has candles on top.", "purpose": "Sharing with family and friends on a birthday.", "how": "Flour, eggs, sugar and butter are mixed and baked in a hot oven until the cake rises and turns soft and spongy.", "made": "Flour, eggs, sugar and butter, with icing and decorations on top.", "origin": "People have baked special cakes for celebrations for hundreds of years.", "fun": "Make a wish and blow out all the candles in one big puff! Candles are hot, so ask a grown-up to help light them."}, {"title": "LANTERN", "img": "lantern", "subject": "Culture", "description": "A lantern is a light you can carry, with a flame or a bulb safely inside a case.", "purpose": "Lighting the way in the dark, and decorating for festivals.", "how": "Glass or paper sides let the light shine out, while keeping the wind away from the flame.", "made": "Metal, glass or paper, with a candle, oil or a battery light inside.", "origin": "People have used lanterns for thousands of years to carry light from place to place.", "fun": "At many festivals around the world, people hang up hundreds of glowing lanterns. If a lantern has a flame, ask a grown-up to help."}, {"title": "CHOPSTICKS", "img": "chopsticks", "subject": "Culture", "description": "Chopsticks are a pair of thin sticks used for eating.", "purpose": "Picking up food like noodles, rice and vegetables.", "how": "You hold both sticks in one hand. The top stick moves and pinches the food against the bottom one.", "made": "Wood, bamboo, plastic or metal.", "origin": "Chopsticks were first used in China thousands of years ago. Today, people use them every day in places like China, Japan, Korea and Vietnam.", "fun": "Using chopsticks takes practice. Try picking up cotton wool balls. It's tricky, but fun!"}, {"title": "FORK", "img": "fork", "subject": "Culture", "description": "A fork is a tool for eating, with a handle and a few pointy prongs at the end.", "purpose": "Picking up food, and holding it still while you cut it.", "how": "The prongs poke into food or scoop it up, so you can lift it to your mouth.", "made": "Metal, plastic or wood.", "origin": "Forks have been used for eating for hundreds of years. Before that, many people ate with knives, spoons and their fingers.", "fun": "The pointy prongs on a fork are called tines. They can be sharp, so ask a grown-up to help."}, {"title": "PAINTBRUSH", "img": "paintbrush", "subject": "Culture", "description": "A paintbrush is a handle with soft bristles on the end, for painting.", "purpose": "Painting pictures, and painting walls and fences too.", "how": "The bristles soak up paint. Then you sweep the brush across the paper to leave a trail of colour.", "made": "A wooden or plastic handle, a metal band, and bristles made of hair or nylon.", "origin": "People have painted with brushes for thousands of years.", "fun": "Wash your brush in water between colours, or your blue might turn green when you dip it in yellow!"}, {"title": "CAMERA", "img": "camera", "subject": "Culture", "description": "A camera is a machine that takes photos. It catches a picture of whatever it is pointed at.", "purpose": "Taking photos and videos to remember special moments.", "how": "Light comes in through the round glass lens. When you press the button, the camera catches that light and turns it into a picture.", "made": "Metal or plastic, with glass lenses, and often batteries and electronic parts inside.", "origin": "The first photos were taken about 200 years ago. People had to keep very still for a long time!", "fun": "Many phones have tiny cameras hidden inside them! Cameras use batteries, so ask a grown-up to help."}, {"title": "TELEPHONE", "img": "telephone", "subject": "Culture", "description": "A telephone is a machine that lets you talk to someone far away.", "purpose": "Calling family and friends, and getting help in an emergency.", "how": "It turns your voice into signals that travel through wires or through the air. The other phone turns them back into sound.", "made": "Plastic and metal, with a speaker, a microphone and electronic parts inside.", "origin": "The telephone was invented about 150 years ago. Alexander Graham Bell made one of the first phone calls in 1876.", "fun": "Old phones had a round dial that you spun with your finger to call a number! Ask a grown-up to help you make a call."}, {"title": "TOOTHPASTE", "img": "toothpaste", "subject": "Human", "description": "Toothpaste is a minty paste that you squeeze onto your toothbrush. It helps clean your teeth and freshen your breath.", "purpose": "Cleaning your teeth and helping to keep them strong and free of holes.", "how": "As you brush, the paste foams up. Tiny gentle grains help scrub away food and germs.", "made": "Water, a gentle scrubbing powder, a minty flavour and fluoride, which helps keep teeth strong.", "origin": "People cleaned their teeth with powders thousands of years ago. Toothpaste in squeezy tubes came along over a hundred years ago.", "fun": "You only need a blob about the size of a pea! Spit it out when you finish, and never swallow it. Ask a grown-up to help."}, {"title": "SOAP", "img": "soap", "subject": "Human", "description": "Soap is a slippery cleaner that makes bubbles when you rub it with water. It often comes as a bar or a liquid.", "purpose": "Washing dirt and germs off your hands and body.", "how": "Soap grabs hold of grease and dirt on your skin. When you rinse with water, the dirt washes away with it.", "made": "Oils or fats mixed with a strong cleaning ingredient, often with a nice smell and colour added.", "origin": "People have been making soap for thousands of years.", "fun": "Wash your hands for about 20 seconds. That is as long as singing Happy Birthday twice!"}, {"title": "COMB", "img": "comb", "subject": "Human", "description": "A comb is a flat strip with a row of thin teeth. You pull it through your hair to make it neat.", "purpose": "Untangling hair and making a tidy parting or style.", "how": "The teeth slide between your hairs and gently pull out the knots, so the hairs lie side by side.", "made": "Plastic, wood, metal or horn.", "origin": "Combs are one of the oldest tools people have. They have been used for thousands of years.", "fun": "A comb has lots of teeth, but it can never bite! Run a plastic comb through dry hair and it can pick up tiny bits of paper."}, {"title": "HAIRBRUSH", "img": "hairbrush", "subject": "Human", "description": "A hairbrush has a handle and a head covered in lots of bristles. It smooths and untangles your hair.", "purpose": "Brushing out knots and making hair smooth and tidy.", "how": "The bristles spread through your hair, catch the tangles and gently pull them loose.", "made": "A plastic or wooden handle, with bristles of plastic or animal hair.", "origin": "People have been brushing their hair for hundreds of years.", "fun": "Start brushing at the ends of your hair and work your way up. Knots come out much more easily that way!"}, {"title": "SOCK", "img": "sock", "subject": "Human", "description": "A sock is a soft, stretchy covering for your foot. You wear it inside your shoe.", "purpose": "Keeping your feet warm and dry, and stopping your shoes from rubbing.", "how": "The stretchy cloth hugs your foot and soaks up sweat, so your feet stay comfy.", "made": "Cotton, wool or stretchy man-made threads.", "origin": "People have kept their feet warm with socks for thousands of years.", "fun": "Socks seem to vanish in the washing machine! Pair them up before washing so no sock is left on its own."}, {"title": "SHOE", "img": "shoe", "subject": "Human", "description": "A shoe is a strong covering for your foot. It has a tough sole underneath to protect you as you walk.", "purpose": "Protecting your feet from sharp stones, hot or cold ground and dirt.", "how": "The thick sole takes the bumps, and laces, straps or Velcro hold the shoe snugly on your foot.", "made": "Leather, rubber, canvas or plastic.", "origin": "Some of the oldest shoes ever found are sandals woven from tree bark, about 10,000 years old.", "fun": "Children's feet grow so fast that they can need bigger shoes more than once a year!"}, {"title": "HAT", "img": "hat", "subject": "Human", "description": "A hat is something you wear on your head. Some keep you warm, and some keep the sun off.", "purpose": "Keeping your head warm in winter, or shading your face and eyes from the sun.", "how": "A woolly hat traps warm air around your head. A wide brim makes a little patch of shade over your face.", "made": "Wool, cotton, straw, felt or leather.", "origin": "People have worn hats for thousands of years, to keep off the sun, the rain and the cold.", "fun": "Some hats tell you about a person's job, like a chef's tall white hat or a firefighter's helmet!"}, {"title": "GLASSES", "img": "glasses", "subject": "Human", "description": "Glasses are two clear lenses held in a frame. They rest on your nose and ears and help you see clearly.", "purpose": "Helping people whose eyes see things blurry to see sharply again.", "how": "The curved lenses bend the light a little, so it lands in just the right place inside your eye.", "made": "Lenses of glass or clear plastic, in a frame of metal or plastic.", "origin": "Glasses were invented in Italy about 700 years ago.", "fun": "The arms of your glasses hook over your ears, so your ears are working as a little shelf!"}, {"title": "BUTTON", "img": "button", "subject": "Human", "description": "A button is a small, flat disc sewn onto clothes. It keeps a shirt, coat or cardigan closed.", "purpose": "Fastening clothes so they stay closed.", "how": "You push the button through a little slit called a buttonhole. Once it is through, it lies flat and cannot slip back out.", "made": "Plastic, metal, wood or shell.", "origin": "People made buttons thousands of years ago, but at first just for decoration. Buttonholes came along in the Middle Ages.", "fun": "Buttons come in every colour and shape, even stars and hearts! They are small, so never put one in your mouth. Ask a grown-up to help sew one back on."}, {"title": "BACKPACK", "img": "backpack", "subject": "Human", "description": "A backpack is a bag with two straps that you carry on your back. It is also called a rucksack.", "purpose": "Carrying books, a lunch, a coat and other things, while keeping your hands free.", "how": "The two straps share the weight across both shoulders, so a heavy load feels easier to carry.", "made": "Strong cloth such as nylon or canvas, with zips and buckles.", "origin": "People have carried packs on their backs for thousands of years. Ötzi the Iceman, who lived over 5,000 years ago, had a backpack frame made of wood.", "fun": "Wear both straps, not just one. Your back will thank you!"}, {"title": "PILLOW", "img": "pillow", "subject": "Human", "description": "A pillow is a soft cushion for your head. You rest on it when you lie down to sleep.", "purpose": "Holding up your head and neck so you can sleep comfortably.", "how": "The soft filling squashes down to fit the shape of your head, then springs back when you get up.", "made": "A cloth cover filled with feathers, foam or fluffy fibres.", "origin": "Long ago in Egypt and China, some people rested their heads on hard pillows made of wood, stone or pottery!", "fun": "Give your pillow a shake and a squash to fluff it up. Air gets back in between the filling and it puffs up again!"}, {"title": "BLANKET", "img": "blanket", "subject": "Human", "description": "A blanket is a big, soft cover. You snuggle under it to stay warm in bed or on the sofa.", "purpose": "Keeping you warm and cosy when you rest or sleep.", "how": "A blanket traps the warm air your body gives off and holds it close to you.", "made": "Wool, cotton or soft fleece.", "origin": "People have kept warm under animal furs and woven cloth for thousands of years.", "fun": "A blanket doesn't make any heat itself. It holds in the heat from your own body, so you are your own heater!"}, {"title": "TOWEL", "img": "towel", "subject": "Human", "description": "A towel is a thick, soft cloth. You use it to dry yourself after a bath, a shower or a swim.", "purpose": "Drying your body, hair and hands.", "how": "A towel is covered in tiny loops of thread. They soak up water like a sponge.", "made": "Usually cotton.", "origin": "Fluffy towels with loops became common in the 1800s, when factories learned how to weave them.", "fun": "A wet towel gets much heavier, because it holds so much water. Hang it up so it is dry for next time!"}, {"title": "MUG", "img": "mug", "subject": "Human", "description": "A mug is a big, sturdy cup with a handle. It is just right for warm drinks.", "purpose": "Drinking hot chocolate, tea, milk or soup.", "how": "You hold the handle, so your fingers stay away from the hot sides. The thick walls keep the drink warm for longer.", "made": "Pottery, glass, metal or plastic.", "origin": "People have made drinking cups out of clay for thousands of years.", "fun": "Some mugs change colour or show a hidden picture when a hot drink is poured in! Ask a grown-up to help with hot drinks."}, {"title": "PLATE", "img": "plate", "subject": "Human", "description": "A plate is a flat, round dish. You put your food on it to eat.", "purpose": "Holding food at mealtimes.", "how": "The flat middle holds your food, and the raised edge stops peas and gravy from sliding off.", "made": "China, pottery, glass, metal, plastic or even paper.", "origin": "Long ago, some people ate off thick slices of old bread called trenchers, instead of plates!", "fun": "In some places, people eat off a big banana leaf instead of a plate! If a plate breaks, the pieces are sharp. Ask a grown-up to help."}, {"title": "CHAIR", "img": "chair", "subject": "Human", "description": "A chair is a seat for one person. It usually has four legs and a back to lean on.", "purpose": "Sitting down to eat, read, draw or rest.", "how": "The legs carry your weight down to the floor, and the back holds you up so you can relax.", "made": "Wood, metal or plastic, sometimes with a soft cushion.", "origin": "Chairs are very old. Fancy chairs have been found in the tombs of ancient Egyptian kings.", "fun": "In the game musical chairs, there is always one chair fewer than players. When the music stops, quick, sit down!"}, {"title": "SPOON", "img": "spoon", "subject": "Human", "description": "A spoon is a little bowl on the end of a handle. You use it to eat soup, cereal and yoghurt.", "purpose": "Scooping up food, stirring and eating runny things.", "how": "The round bowl holds food and liquid, and the handle lets you lift it to your mouth.", "made": "Metal, wood or plastic.", "origin": "People have used spoons for thousands of years. The first ones were shells and carved bits of wood or bone.", "fun": "Look into a shiny spoon. In the hollow side you appear upside down, but on the back you are the right way up!"}, {"title": "PLASTER", "img": "plaster", "subject": "Human", "description": "A plaster is a small sticky strip with a soft pad in the middle. It covers small cuts and scrapes.", "purpose": "Keeping dirt and germs out of a small cut while it heals.", "how": "The sticky ends hold onto your skin, and the soft pad sits over the cut to protect it.", "made": "A strip of cloth or plastic, a sticky glue, and a soft cotton pad.", "origin": "Sticking plasters were invented about a hundred years ago. Before that, people tied on strips of cloth.", "fun": "Plasters come in fun colours and patterns, so a scraped knee can wear dinosaurs or stars! Ask a grown-up to help clean the cut first."}, {"title": "LUNCH BOX", "img": "lunch-box", "subject": "Human", "description": "A lunch box is a box with a lid for carrying your food. You take it to school or on a day out.", "purpose": "Keeping your lunch clean, safe and not squashed until it is time to eat.", "how": "The lid closes tightly to keep food in and dirt out. Some have an ice pack to keep food cool.", "made": "Plastic, metal or padded cloth.", "origin": "Long ago, workers carried lunch in metal pails. Lunch boxes with cartoon pictures became popular with children in the 1950s.", "fun": "Bento boxes from Japan have lots of little sections, so every food gets its very own room!"}, {"title": "WATER BOTTLE", "img": "water-bottle", "subject": "Human", "description": "A water bottle is a bottle with a lid that you can carry around. It lets you have a drink wherever you go.", "purpose": "Carrying water so you can drink whenever you are thirsty.", "how": "The lid seals the top so water cannot spill. Some bottles have two walls that keep drinks cold for hours.", "made": "Plastic, metal or glass.", "origin": "Long ago, travellers carried water in bags made from animal skins or in dried, hollow fruits called gourds.", "fun": "Your body is more than half water! Sipping water through the day helps you think and play."}, {"title": "GLOVES", "img": "gloves", "subject": "Human", "description": "Gloves are coverings for your hands, with a little space for each finger and thumb.", "purpose": "Keeping your hands warm, and protecting them from cold, dirt or scratches.", "how": "The cloth traps warm air around each finger. Because your fingers are separate, you can still hold things.", "made": "Wool, leather, cotton or rubber.", "origin": "People have worn gloves for thousands of years. Gloves were even found in the tomb of the Egyptian king Tutankhamun.", "fun": "Mittens keep fingers warmer than gloves, because your fingers snuggle up together and share their heat!"}, {"title": "SCARF", "img": "scarf", "subject": "Human", "description": "A scarf is a long strip of soft cloth. You wrap it around your neck to keep warm.", "purpose": "Keeping your neck and chin warm on cold, windy days.", "how": "Wrapping it round your neck traps warm air and stops chilly wind getting down your collar.", "made": "Wool, cotton or silk.", "origin": "People have wrapped cloth around their necks to keep warm for thousands of years.", "fun": "Football fans wear scarves in their team's colours and hold them high to cheer! Tuck your scarf in on slides and climbing frames, so it can't get caught."}, {"title": "SLIPPERS", "img": "slippers", "subject": "Human", "description": "Slippers are soft, comfy shoes that you wear indoors. They keep your feet cosy at home.", "purpose": "Keeping your feet warm on cold floors and keeping outdoor dirt out of the house.", "how": "The soft sole sits between your feet and the cold floor. They have no laces, so they slip on and off easily.", "made": "Soft cloth, fleece, wool or felt, often with a bendy rubber sole.", "origin": "People have worn soft shoes indoors for hundreds of years.", "fun": "They are called slippers because you can slip them on and off without doing up any laces!"}, {"title": "BED", "img": "bed", "subject": "Human", "description": "A bed is a piece of furniture for sleeping on. It has a frame and a soft mattress, with a pillow and covers on top.", "purpose": "Giving you a comfy, cosy place to sleep each night.", "how": "The springy mattress holds up your body, and the frame lifts you off the cold floor.", "made": "A frame of wood or metal, and a mattress of springs, foam and cloth.", "origin": "Long ago, people slept on piles of grass, leaves or animal skins. The ancient Egyptians had raised beds.", "fun": "You will spend about a third of your whole life asleep. That is a lot of time in bed!"}, {"title": "TISSUES", "img": "tissues", "subject": "Human", "description": "Tissues are thin, soft sheets of paper. You use one to blow your nose or catch a sneeze.", "purpose": "Catching sneezes and coughs and wiping your nose, so germs do not spread.", "how": "The soft paper soaks up wetness. You use it once and put it in the bin, then wash your hands.", "made": "Very thin, soft paper made from wood.", "origin": "Paper tissues became popular about a hundred years ago. Before that, people used cloth handkerchiefs.", "fun": "In a tissue box, the tissues are folded into each other, so pulling one out pops the next one up, ready to go!"}];

    u.rate = 0.9; u.pitch = 1.05;
    u.onstart = () => { document.querySelectorAll(".reading").forEach(e => e.classList.remove("reading")); el.classList.add("reading"); el.scrollIntoView({ block: "nearest", behavior: reduceMotion() ? "auto" : "smooth" }); };
    u.onend = () => { el.classList.remove("reading"); if (i === blocks.length - 1) stopReading(); };
    synth.speak(u);
  });
}

/* ---------- stars and sounds (saved on this device only) ---------- */
const PROGRESS_KEY = "dailythings.progress.v1";
let progress = { learned: [], stars: 0, sound: true };
try { const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "null"); if (saved) progress = { ...progress, ...saved }; } catch (e) {}
const saveProgress = () => { try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {} };
const isLearned = f => progress.learned.includes(f.img);
const niceName = f => f.title.charAt(0) + f.title.slice(1).toLowerCase();
const starChip = () => `<span class="star-chip" aria-label="${progress.stars} stars">${STAR("#153744")}<b data-stars>${progress.stars}</b></span>`;
function addStar() {
  progress.stars += 1; saveProgress();
  document.querySelectorAll("[data-stars]").forEach(el => { el.textContent = progress.stars; const chip = el.closest(".star-chip"); chip.classList.remove("bump"); void chip.offsetWidth; chip.classList.add("bump"); });
}

// Short, gentle chimes made in the browser: no sound files to download.
let audio = null;
function chime(kind) {
  if (!progress.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const notes = { win: [523.25, 659.25, 783.99, 1046.5], pop: [880], oops: [311.13, 261.63] }[kind];
    notes.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * (kind === "win" ? 0.09 : 0.12);
      o.type = kind === "oops" ? "sine" : "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(kind === "pop" ? 0.08 : 0.14, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.32);
    });
  } catch (e) {}
}

function confetti(fromEl) {
  if (reduceMotion()) return;
  const host = document.querySelector(".screen"), hr = host.getBoundingClientRect(), r = fromEl.getBoundingClientRect();
  const layer = document.createElement("div"); layer.className = "confetti";
  const cx = r.left + r.width / 2 - hr.left, cy = r.top + r.height / 2 - hr.top;
  const colours = ["#FFCF5A", "#5FA882", "#5A9EBB", "#E09A52", "#9783CF", "#F28B7B"];
  for (let i = 0; i < 36; i++) {
    const a = Math.random() * Math.PI * 2, d = 80 + Math.random() * 130, c = colours[i % colours.length];
    const bit = document.createElement("i");
    if (i % 3 === 0) { bit.className = "star"; bit.innerHTML = STAR(c); } else bit.style.background = c;
    bit.style.left = cx + "px"; bit.style.top = cy + "px";
    bit.style.setProperty("--dx", Math.cos(a) * d + "px");
    bit.style.setProperty("--dy", Math.sin(a) * d - 40 + "px");
    bit.style.setProperty("--r", (Math.random() * 540 - 270) + "deg");
    layer.appendChild(bit);
  }
  host.appendChild(layer);
  setTimeout(() => layer.remove(), 1100);
}

function speakOnce(text) {
  if (!synth) return;
  stopReading();
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.rate = 0.9; u.pitch = 1.1;
  synth.speak(u);
}

let game = null;  // { thing, options, wrong, solved, fx, fy }
// Photos that show another object too (the compass lies on a map, the pillow has a teddy bear on it).
// Such pairs never appear in the same question, so a child is never marked wrong for naming what they see.
const LOOKS_ALIKE = [["compass", "map"], ["pillow", "teddy-bear"], ["tea-bag", "mug"], ["map", "mug"],
  ["birthday-cake", "candle"], ["lunch-box", "fridge"], ["glasses", "notebook"]];
const confusable = (a, b) => LOOKS_ALIKE.some(([x, y]) => (a.img === x && b.img === y) || (a.img === y && b.img === x));
function newRound() {
  const pool = FACTS.filter(f => !game || f !== game.thing);
  const thing = pool[Math.floor(Math.random() * pool.length)];
  const others = shuffle(FACTS.filter(f => f.subject !== thing.subject && !confusable(f, thing))).slice(0, 2);
  game = { thing, options: shuffle([thing, ...others]), wrong: [], solved: false, fx: 30 + Math.random() * 40, fy: 30 + Math.random() * 40 };
}
// Starts close up; every wrong guess zooms out a little as a hint.
const gameZoom = () => (game.solved ? 1 : [2.8, 1.9, 1.4][Math.min(game.wrong.length, 2)]);
const gameAfter = () => `<button type="button" class="learn-btn" data-act="next-round">${STAR("#153744")} Next mystery</button>
  <button type="button" class="guess-opt center" data-act="learn-about">Learn about it ${SNAKE("right", 22)}</button>`;

function gameScreen() {
  const { thing, options, wrong, solved, fx, fy } = game;
  return `${siteNav()}<main class="page screen-enter min-h-dvh bg-[#F2EFE7] px-6 pb-10 pt-7 text-[#153744]">
    <header class="screen-head mx-auto flex max-w-md items-center justify-between">${backBtn("Back to home")}${mark()}<span class="spacer-44" style="display:flex;justify-content:flex-end">${starChip()}</span></header>
    <section class="game-wrap mx-auto mt-8 max-w-md">
      <p class="mystery-label text-xs font-semibold uppercase tracking-[0.18em]">Mystery game</p>
      <h1 class="mt-3 text-[38px] font-semibold leading-none tracking-[-0.045em]">Guess what?</h1>
      <div class="mystery mt-6"><img id="mystery-img" src="${imgSrc(thing)}" alt="${solved ? esc(niceName(thing)) : "A mystery object, zoomed in"}" draggable="false" style="transform:scale(${gameZoom()});transform-origin:${fx}% ${fy}%"></div>
      <p class="game-feedback mt-4 ${solved ? "win" : ""}" id="game-feedback" aria-live="polite">${solved ? `You got it: ${esc(niceName(thing))}!` : wrong.length ? "Not quite. Look closer and try again!" : "What is it? Pick one."}</p>
      <div class="guess-options mt-3 grid gap-3">${options.map(o => {
        const isRight = solved && o === thing, isWrong = wrong.includes(o.img);
        return `<button type="button" class="guess-opt${isRight ? " right" : ""}${isWrong ? " wrong" : ""}" data-act="guess" data-img="${o.img}"${solved || isWrong ? " disabled" : ""}>${esc(niceName(o))}${isRight ? ICON_CHECK : ""}</button>`;
      }).join("")}</div>
      <div class="mt-5 grid gap-3" id="game-after">${solved ? gameAfter() : ""}</div>
    </section>
  </main>`;
}

function guess(b) {
  if (!game || game.solved) return;
  const img = document.getElementById("mystery-img"), feedback = document.getElementById("game-feedback");
  if (b.dataset.img === game.thing.img) {
    game.solved = true;
    addStar(); chime("win"); confetti(b);
    b.classList.add("right"); b.insertAdjacentHTML("beforeend", ICON_CHECK);
    document.querySelectorAll('.guess-opt[data-act="guess"]').forEach(x => { x.disabled = true; });
    feedback.textContent = `You got it: ${niceName(game.thing)}!`; feedback.classList.add("win");
    img.style.transform = "scale(1)"; img.alt = niceName(game.thing);
    document.getElementById("game-after").innerHTML = gameAfter();
    speakOnce(`You got it! ${niceName(game.thing)}!`);
  } else {
    game.wrong.push(b.dataset.img);
    chime("oops");
    b.classList.add("wrong"); b.disabled = true;
    feedback.textContent = "Not quite. Look closer and try again!";
    img.style.transform = `scale(${gameZoom()})`;
  }
}

function learn(b) {
  const f = FACTS.find(x => x.img === b.dataset.img);
  if (!f || isLearned(f)) return;
  progress.learned.push(f.img); saveProgress();
  addStar(); chime("win"); confetti(b);
  b.outerHTML = learnButton(f);
}

let lastSwipe = 0;
function pop(el) {
  if (Date.now() - lastSwipe < 500) return;
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
  chime("pop");
  speakOnce(el.dataset.name);
}

/* ---------- navigation ---------- */
function render() {
  stopReading();
  document.documentElement.style.setProperty("--screen-bg", state.screen === "detail" ? "#F7F6F1" : "#F2EFE7");
  root.innerHTML = state.screen === "splash" ? splash() : state.screen === "home" ? home() : state.screen === "subjects" ? subjects() : state.screen === "game" ? gameScreen() : detailScreen();
  window.scrollTo(0, 0);
  if (state.screen === "detail") preload();
}
function go(screen) { backStack.push(state); state = { screen }; render(); }
function back() { state = backStack.pop() || { screen: "home" }; render(); }

function todayIndex() {
  const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5) % FACTS.length;
}
function openRandom() {
  const today = FACTS[todayIndex()];
  detail = { list: [today, ...shuffle(FACTS.filter(f => f !== today))], active: 0, from: "home", busy: false };
  go("detail");
}
function openSubject(name) {
  detail = { list: FACTS.filter(f => f.subject === name), active: 0, from: "subject", busy: false };
  go("detail");
}
function preload() {
  const { list, active } = detail;
  [list[(active + 1) % list.length], list[(active - 1 + list.length) % list.length]].forEach(f => { const i = new Image(); i.src = imgSrc(f); });
}

// Swipe or tap to the next card, with the prototype's slide animation.
function change(dir) {
  if (!detail || detail.busy) return;
  stopReading();
  const { list, active } = detail;
  const target = dir === "next" ? (active + 1) % list.length : (active - 1 + list.length) % list.length;
  const finish = () => { detail.active = target; detail.busy = false; root.innerHTML = detailScreen(); document.querySelector("#detail").classList.remove("screen-enter"); window.scrollTo(0, 0); preload(); };
  if (reduceMotion()) { finish(); return; }
  detail.busy = true;
  window.scrollTo({ top: 0 });
  const stage = document.getElementById("stage"), cur = document.getElementById("card-current");
  const counter = document.querySelector(".dt-head .tabular-nums");
  if (counter) counter.textContent = pad2(target + 1);
  cur.classList.add(dir === "next" ? "fact-exit-left" : "fact-exit-right");
  stage.insertAdjacentHTML("beforeend", factCard(list[target], `absolute inset-x-0 top-0 ${dir === "next" ? "fact-enter-right" : "fact-enter-left"}`, "card-incoming"));
  const inc = document.getElementById("card-incoming");
  inc.addEventListener("animationend", e => { if (e.target === inc) finish(); }, { once: false });
}

/* ---------- input ---------- */
// On touch screens a button acts when the finger lifts. Chrome can swallow the "click" for a tap that lands
// while a fast swipe is still coasting, and a child would think Back was broken. The click that follows is skipped.
let tapDown = null, skipClickUntil = 0;
document.addEventListener("pointerdown", e => {
  if (e.pointerType !== "touch") return;
  const el = e.target.closest("[data-act]");
  tapDown = el ? { el, x: e.clientX, y: e.clientY, t: Date.now() } : null;
}, true);
document.addEventListener("pointerup", e => {
  if (e.pointerType !== "touch" || !tapDown) return;
  const d = tapDown; tapDown = null;
  const el = e.target.closest("[data-act]");
  if (el !== d.el || el.disabled || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 12 || Date.now() - d.t > 800) return;
  skipClickUntil = Date.now() + 700;
  activate(el);
}, true);
document.addEventListener("pointercancel", () => { tapDown = null; }, true);
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (Date.now() < skipClickUntil) return;
  activate(b);
});
function activate(b) {
  if (b.querySelector(".snake") && !reduceMotion()) {
    if (b.classList.contains("slithering")) return;
    b.classList.add("slithering");
    setTimeout(() => { b.classList.remove("slithering"); act(b); }, 300);
    return;
  }
  act(b);
}
function act(b) {
  switch (b.dataset.act) {
    case "random": openRandom(); break;
    case "subjects": go("subjects"); break;
    case "subject": openSubject(b.dataset.name); break;
    case "back": back(); break;
    case "next": change("next"); break;
    case "prev": change("previous"); break;
    case "listen": reading ? stopReading() : readCard(); break;
    case "game": newRound(); go("game"); break;
    case "nav-home": backStack = []; state = { screen: "home" }; render(); break;
    case "nav-random": backStack = []; state = { screen: "home" }; openRandom(); break;
    case "nav-subjects": backStack = []; state = { screen: "home" }; go("subjects"); break;
    case "nav-game": backStack = []; state = { screen: "home" }; newRound(); go("game"); break;
    case "guess": guess(b); break;
    case "next-round": newRound(); render(); break;
    case "learn-about":
      detail = { list: [game.thing, ...FACTS.filter(f => f.subject === game.thing.subject && f !== game.thing)], active: 0, from: "game", busy: false };
      go("detail"); break;
    case "learn": learn(b); break;
    case "pop": pop(b); break;
    case "sound":
      progress.sound = !progress.sound; saveProgress();
      document.querySelectorAll('[data-act="sound"]').forEach(x => {
        x.setAttribute("aria-pressed", progress.sound);
        x.setAttribute("aria-label", progress.sound ? "Turn sounds off" : "Turn sounds on");
        x.innerHTML = progress.sound ? ICON_SOUND_ON : ICON_SOUND_OFF;
      });
      if (progress.sound) chime("pop");
      break;
  }
}
// Swipe: watch the pointer without capturing it, so Back and the other buttons still get their taps.
let start = null;
document.addEventListener("pointerdown", e => { if (state.screen === "detail" && e.isPrimary) start = { x: e.clientX, y: e.clientY }; });
document.addEventListener("pointerup", e => {
  if (!start) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y; start = null;
  if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
  lastSwipe = Date.now();
  change(dx < 0 ? "next" : "previous");
});
document.addEventListener("pointercancel", () => { start = null; });
document.addEventListener("keydown", e => {
  if (state.screen !== "detail") return;
  if (e.key === "ArrowRight") change("next");
  if (e.key === "ArrowLeft") change("previous");
});


render();
setTimeout(() => { state = { screen: "home" }; render(); }, 1500);
</script>
